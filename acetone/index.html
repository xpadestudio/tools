<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACETONE — Image Watermark Cleaner</title>
  <style>
    :root{--acid:#cdfa17;--bg:#0a0b0b;--panel:#121414;--panel2:#181a1a;--line:#292c2c;--text:#f1f3ef;--muted:#8d9490;--danger:#ff6f66}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
    button,input,select{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:62px 1fr}
    header{display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:#0d0f0f}
    .brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand i{font-style:normal;color:var(--acid)}
    .tag{color:var(--muted);font-size:11px;letter-spacing:1.4px}.spacer{flex:1}.privacy{font-size:12px;color:var(--muted)}.privacy b{color:var(--acid)}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:1px;background:var(--line)}
    .work{min-width:0;display:grid;grid-template-rows:1fr 160px;background:var(--bg)}
    .stage-wrap{position:relative;min-height:0;display:grid;place-items:center;padding:22px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#202323 0,#0c0e0e 68%)}
    .empty{width:min(620px,75%);height:270px;border:1px dashed #414646;border-radius:18px;display:grid;place-items:center;text-align:center;color:var(--muted);transition:.2s}
    .empty.drag{border-color:var(--acid);background:#cdfa170c}.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:6px}.empty button{margin-top:18px}
    .viewer{display:none;position:relative;width:100%;height:100%;min-width:0;min-height:0;user-select:none}.viewer.active{display:flex;align-items:center;justify-content:center}
    #preview{display:block;max-width:100%;max-height:calc(100vh - 270px);box-shadow:0 14px 45px #0008;background:#111}
    .roi{position:absolute;border:1px solid var(--acid);box-shadow:0 0 0 9999px #00000022;cursor:move}
    .roi:before,.roi:after{content:"";position:absolute;background:var(--acid)}.roi:before{left:50%;top:-6px;width:1px;height:calc(100% + 12px);opacity:.35}.roi:after{top:50%;left:-6px;height:1px;width:calc(100% + 12px);opacity:.35}
    .handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:3px;background:var(--acid);border:2px solid #111;cursor:nwse-resize}
    .badge{position:absolute;left:0;top:-27px;background:var(--acid);color:#111;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:800;white-space:nowrap}
    .toolbar{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(320px,1.3fr);gap:18px;padding:16px 20px;border-top:1px solid var(--line);background:var(--panel)}
    .control{min-width:0}.control label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:7px}.control output{color:var(--text)}
    input[type=range]{width:100%;accent-color:var(--acid)}select,.num{width:100%;height:34px;color:var(--text);background:#0d0f0f;border:1px solid var(--line);border-radius:7px;padding:0 9px}
    .coords{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.coords input{min-width:0;padding:0 5px;text-align:center}
    aside{min-height:0;background:var(--panel);display:grid;grid-template-rows:auto auto 1fr auto}
    .side-head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.side-head h2{font-size:14px;margin:0}.count{color:var(--muted);font-size:12px}
    .actions{padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line)}
    .btn{height:38px;border-radius:8px;border:1px solid var(--line);background:#202323;color:var(--text);font-weight:700}.btn:hover{border-color:#505656}.btn.primary{background:var(--acid);border-color:var(--acid);color:#111}.btn.ghost{background:transparent}.btn:disabled{opacity:.35;cursor:not-allowed}
    .queue{min-height:0;overflow:auto;padding:10px}.item{width:100%;min-width:0;overflow:hidden;display:grid;grid-template-columns:54px minmax(0,1fr) 66px;gap:10px;align-items:center;padding:9px;border:1px solid transparent;border-radius:9px;cursor:pointer}.item:hover{background:#1a1d1d}.item.selected{border-color:#465051;background:#1b1e1e}
    .thumb{width:54px;height:42px;object-fit:cover;border-radius:5px;background:#080909}.item>div{min-width:0;overflow:hidden}.name{display:block;width:100%;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--muted);margin-top:3px}.status{justify-self:center;width:9px;height:9px;border-radius:50%;background:#555}.status.ready{background:#79807c}.status.working{background:#ffcc46;box-shadow:0 0 8px #ffcc46}.status.done{background:var(--acid)}.status.error{background:var(--danger)}.item-actions{display:flex!important;align-items:center;justify-content:flex-end;gap:2px;overflow:visible!important}.mini{border:0;background:transparent;color:var(--acid);font-size:11px;padding:5px;white-space:nowrap}.mini.remove{color:#7d8581;font-size:16px;line-height:1}.mini.remove:hover{color:var(--danger)}
    .footer{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:8px}.progress{height:4px;background:#282b2b;border-radius:3px;overflow:hidden}.bar{height:100%;width:0;background:var(--acid);transition:.2s}.footer-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.auto-remove{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.auto-remove input{accent-color:var(--acid)}
    .hint{position:absolute;right:18px;bottom:14px;color:#727976;font-size:11px;background:#111b;padding:6px 9px;border-radius:6px}
    @media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}main{grid-template-columns:1fr}.work{min-height:720px}aside{min-height:520px}#preview{max-height:520px}.privacy{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">ACET<i>O</i>NE</div><div class="tag">IMAGE WATERMARK CLEANER · XPADE</div><div class="spacer"></div><div class="privacy"><b>LOCAL</b> · 이미지는 브라우저 밖으로 전송되지 않습니다</div></header>
  <main>
    <section class="work">
      <div class="stage-wrap" id="dropZone">
        <div class="empty" id="empty"><div><strong>이미지를 여기에 놓으세요</strong>JPG · PNG · WEBP / 여러 파일 선택 가능<br><button class="btn primary" id="pickTop">이미지 선택</button></div></div>
        <div class="viewer" id="viewer"><canvas id="preview"></canvas><div class="roi" id="roi"><span class="badge">WATERMARK ROI</span><i class="handle"></i></div></div>
        <div class="hint">ROI 드래그 · 방향키 미세 조절 · Space 원본 비교</div>
      </div>
      <div class="toolbar">
        <div class="control"><label>출력 형식</label><select id="format"><option value="same">원본 형식</option><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select></div>
        <div class="control"><label>좌표 X · Y · W · H</label><div class="coords"><input class="num" id="rx" type="number"><input class="num" id="ry" type="number"><input class="num" id="rw" type="number"><input class="num" id="rh" type="number"></div></div>
      </div>
    </section>
    <aside>
      <div class="side-head"><h2>처리 큐</h2><span class="count" id="count">0개</span></div>
      <div class="actions"><button class="btn" id="pick">+ 이미지 추가</button><button class="btn ghost" id="clear">목록 비우기</button><button class="btn" id="applySame">동일 규격에 적용</button><button class="btn primary" id="run">전체 처리</button></div>
      <div class="queue" id="queue"></div>
      <div class="footer"><button class="btn primary" id="downloadAll" disabled>완료 파일 모두 저장</button><label class="auto-remove"><input id="autoRemove" type="checkbox" checked> 저장 후 큐에서 자동 제거</label><div class="progress"><div class="bar" id="bar"></div></div><div class="footer-row"><span id="progressText">대기 중</span><span id="profileText">자동 프리셋</span></div></div>
    </aside>
  </main>
</div>
<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>

  const maskCache={};
  async function getMask(key){const resolvedKey=key==='1792x2400'?'1529x2048':key;if(maskCache[resolvedKey])return maskCache[resolvedKey];const img=new Image();img.src=maskSources[resolvedKey]||maskSources['1376x768'];await img.decode();maskCache[resolvedKey]=img;return img}
  let items=[], selected=null, dragging=null, running=false;
  const extMime={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'};
  function nearestProfile(w,h){
    const exactKey=`${w}x${h}`,exact=profiles[exactKey]; if(exact)return {...exact,key:exactKey,name:`${w}×${h} 정확히 일치`};
    let best=null,score=1e9;
    for(const [key,p] of Object.entries(profiles)){const [pw,ph]=key.split('x').map(Number);const s=Math.abs(w/h-pw/ph)*4+Math.abs(Math.log(Math.max(w,h)/Math.max(pw,ph)));if(s<score){score=s;best={key,p,pw,ph}}}
    const sx=w/best.pw,sy=h/best.ph,scale=(sx+sy)/2;
    return {cx:w-(best.pw-best.p.cx)*sx,cy:h-(best.ph-best.p.cy)*sy,size:best.p.size*scale,key:best.key,name:`${best.key.replace('x','×')} 비례 적용`};
  }
  async function addFiles(files){
    for(const file of files){if(!/^image\/(jpeg|png|webp)$/.test(file.type))continue;const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();const p=nearestProfile(img.naturalWidth,img.naturalHeight),s=Math.round(p.size);items.push({id:crypto.randomUUID(),file,url,img,w:img.naturalWidth,h:img.naturalHeight,status:'ready',roi:{x:Math.round(p.cx-s/2),y:Math.round(p.cy-s/2),w:s,h:s},profile:p.name,profileKey:p.key,result:null});}
    if(!selected&&items.length)select(items[0]);renderQueue();updateCount();
  }
  function select(item){selected=item;$('#empty').style.display='none';$('#viewer').classList.add('active');drawPreview();syncControls();renderQueue();}
  function drawPreview(original=false){if(!selected)return;preview.width=selected.w;preview.height=selected.h;ctx.clearRect(0,0,preview.width,preview.height);if(!original&&selected.resultCanvas)ctx.drawImage(selected.resultCanvas,0,0);else ctx.drawImage(selected.img,0,0);requestAnimationFrame(positionRoi);$('#profileText').textContent=selected.profile;}
  function positionRoi(){if(!selected)return;const r=preview.getBoundingClientRect(),v=$('#viewer').getBoundingClientRect(),sx=r.width/selected.w,sy=r.height/selected.h,o=selected.roi,el=$('#roi');el.style.left=`${r.left-v.left+o.x*sx}px`;el.style.top=`${r.top-v.top+o.y*sy}px`;el.style.width=`${o.w*sx}px`;el.style.height=`${o.h*sy}px`;}
  function syncControls(){if(!selected)return;const r=selected.roi;$('#rx').value=r.x;$('#ry').value=r.y;$('#rw').value=r.w;$('#rh').value=r.h;}
  function readControls(){if(!selected)return;const r=selected.roi;r.x=+$('#rx').value||0;r.y=+$('#ry').value||0;r.w=Math.max(24,+$('#rw').value||24);r.h=Math.max(24,+$('#rh').value||24);clampRoi();positionRoi();}
  function clampRoi(){const r=selected.roi;r.w=Math.min(r.w,selected.w);r.h=Math.min(r.h,selected.h);r.x=Math.max(0,Math.min(selected.w-r.w,r.x));r.y=Math.max(0,Math.min(selected.h-r.h,r.y));}
  function renderQueue(){queueEl.innerHTML='';for(const it of items){const row=document.createElement('div');row.className='item'+(it===selected?' selected':'');row.innerHTML=`<img class="thumb" src="${it.url}"><div><div class="name" title="${escapeHtml(it.file.name)}">${escapeHtml(it.file.name)}</div><div class="meta">${it.w}×${it.h} · ${it.profile}</div></div><div class="item-actions">${it.result?'<button class="mini save" title="이 파일 저장">저장</button>':`<i class="status ${it.status}"></i>`}<button class="mini remove" title="큐에서 제거" aria-label="큐에서 제거">×</button></div>`;row.onclick=()=>select(it);const save=row.querySelector('.save');if(save)save.onclick=e=>{e.stopPropagation();saveOne(it)};row.querySelector('.remove').onclick=e=>{e.stopPropagation();removeItem(it)};queueEl.appendChild(row)}}
  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function updateCount(){const done=items.filter(x=>x.status==='done').length;$('#count').textContent=`${items.length}개 · 완료 ${done}`;$('#downloadAll').disabled=!done;}
  async function processItem(it){
    const c=document.createElement('canvas');c.width=it.w;c.height=it.h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(it.img,0,0);
    const r=it.roi,ix=Math.round(r.x),iy=Math.round(r.y),iw=Math.round(r.w),ih=Math.round(r.h),data=x.getImageData(ix,iy,iw,ih),p=data.data;
    const maskImage=await getMask(it.profileKey);
    const mc=document.createElement('canvas');mc.width=iw;mc.height=ih;const mx=mc.getContext('2d');mx.imageSmoothingEnabled=true;mx.drawImage(maskImage,0,0,iw,ih);const md=mx.getImageData(0,0,iw,ih).data;
    // Very dark backgrounds amplify tiny alpha errors. Use local inpainting there;
    // otherwise preserve texture with calibrated reverse-alpha restoration.
    let borderLum=0,borderN=0;
    for(let y=0;y<ih;y++)for(let xx=0;xx<iw;xx++)if(xx<4||y<4||xx>=iw-4||y>=ih-4){const i=(y*iw+xx)*4;borderLum+=(p[i]*.2126+p[i+1]*.7152+p[i+2]*.0722);borderN++}
    if(borderLum/Math.max(1,borderN)<80)inpaintDark(p,md,iw,ih);
    else for(let y=0;y<ih;y++)for(let xx=0;xx<iw;xx++){
      const i=(y*iw+xx)*4,a=md[i]/255;if(a<.001)continue;const den=Math.max(.5,1-a);p[i]=Math.max(0,Math.min(255,(p[i]-255*a)/den));p[i+1]=Math.max(0,Math.min(255,(p[i+1]-255*a)/den));p[i+2]=Math.max(0,Math.min(255,(p[i+2]-255*a)/den));
    }
    x.putImageData(data,ix,iy);it.resultCanvas=c;
    const fmt=$('#format').value==='same'?(extMime[it.file.name.split('.').pop().toLowerCase()]||it.file.type||'image/png'):$('#format').value;
    it.outMime=fmt;it.result=await new Promise(res=>c.toBlob(res,fmt,.96));it.status='done';
  }
  function inpaintDark(p,md,w,h){
    let mask=new Uint8Array(w*h);for(let i=0;i<w*h;i++)if(md[i*4]>1)mask[i]=1;
    for(let pass=0;pass<2;pass++){const next=mask.slice();for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(mask[i]||mask[i-1]||mask[i+1]||mask[i-w]||mask[i+w])next[i]=1}mask=next}
    const work=new Float32Array(w*h*3);let sr=0,sg=0,sb=0,n=0;
    for(let i=0;i<w*h;i++){work[i*3]=p[i*4];work[i*3+1]=p[i*4+1];work[i*3+2]=p[i*4+2];if(!mask[i]){sr+=p[i*4];sg+=p[i*4+1];sb+=p[i*4+2];n++}}
    sr/=n;sg/=n;sb/=n;for(let i=0;i<w*h;i++)if(mask[i]){work[i*3]=sr;work[i*3+1]=sg;work[i*3+2]=sb}
    for(let pass=0;pass<140;pass++)for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(!mask[i])continue;for(let c=0;c<3;c++)work[i*3+c]=(work[(i-1)*3+c]+work[(i+1)*3+c]+work[(i-w)*3+c]+work[(i+w)*3+c])*.25}
    for(let i=0;i<w*h;i++)if(mask[i]){p[i*4]=work[i*3];p[i*4+1]=work[i*3+1];p[i*4+2]=work[i*3+2]}
  }
  async function runAll(){if(running||!items.length)return;running=true;$('#run').disabled=true;let n=0;for(const it of items){it.status='working';renderQueue();$('#progressText').textContent=`처리 중 ${n+1}/${items.length}`;try{await processItem(it)}catch(e){console.error(e);it.status='error'}n++;$('#bar').style.width=`${n/items.length*100}%`;renderQueue();updateCount();if(it===selected)drawPreview();await new Promise(r=>setTimeout(r,20));}running=false;$('#run').disabled=false;$('#progressText').textContent='처리 완료';}
  function outName(it){const base=it.file.name.replace(/\.[^.]+$/,''),ext=it.outMime==='image/png'?'png':it.outMime==='image/webp'?'webp':'jpg';return `${base}_acetone.${ext}`}
  function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  function saveOne(it){saveBlob(it.result,outName(it));if($('#autoRemove').checked)setTimeout(()=>removeItem(it),350)}
  function removeItem(it){if(it.status==='working')return;const index=items.indexOf(it);if(index<0)return;URL.revokeObjectURL(it.url);items.splice(index,1);if(selected===it){selected=items[Math.min(index,items.length-1)]||null;if(selected)select(selected);else{$('#viewer').classList.remove('active');$('#empty').style.display='grid';$('#profileText').textContent='자동 프리셋'}}renderQueue();updateCount()}
  async function downloadAll(){const done=items.filter(x=>x.result);for(const it of done){saveBlob(it.result,outName(it));await new Promise(r=>setTimeout(r,220))}if($('#autoRemove').checked)for(const it of done)removeItem(it)}
  function clearAll(){for(const it of items)URL.revokeObjectURL(it.url);items=[];selected=null;queueEl.innerHTML='';$('#viewer').classList.remove('active');$('#empty').style.display='grid';$('#bar').style.width='0';$('#progressText').textContent='대기 중';updateCount()}
  document.querySelectorAll('#pick,#pickTop').forEach(b=>b.onclick=()=>fileInput.click());fileInput.onchange=e=>{addFiles(e.target.files);e.target.value=''};
  const dz=$('#dropZone');['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();$('#empty').classList.add('drag')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();$('#empty').classList.remove('drag')}));dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
  $('#clear').onclick=clearAll;$('#run').onclick=runAll;$('#downloadAll').onclick=downloadAll;
  ['#rx','#ry','#rw','#rh'].forEach(id=>$(id).oninput=readControls);
  $('#applySame').onclick=()=>{if(!selected)return;for(const it of items)if(it.w===selected.w&&it.h===selected.h&&it!==selected)it.roi={...selected.roi};$('#progressText').textContent='동일 규격에 좌표 적용됨'};
  $('#roi').addEventListener('pointerdown',e=>{if(!selected)return;e.preventDefault();const resize=e.target.classList.contains('handle'),pr=preview.getBoundingClientRect();dragging={resize,startX:e.clientX,startY:e.clientY,roi:{...selected.roi},sx:selected.w/pr.width,sy:selected.h/pr.height};e.currentTarget.setPointerCapture(e.pointerId)});
  $('#roi').addEventListener('pointermove',e=>{if(!dragging)return;const dx=(e.clientX-dragging.startX)*dragging.sx,dy=(e.clientY-dragging.startY)*dragging.sy;if(dragging.resize){selected.roi.w=Math.max(24,dragging.roi.w+dx);selected.roi.h=Math.max(24,dragging.roi.h+dy)}else{selected.roi.x=dragging.roi.x+dx;selected.roi.y=dragging.roi.y+dy}clampRoi();syncControls();positionRoi()});
  $('#roi').addEventListener('pointerup',()=>dragging=null);window.addEventListener('resize',positionRoi);
  window.addEventListener('keydown',e=>{if(!selected)return;if(e.code==='Space'){e.preventDefault();drawPreview(true);return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const d=e.shiftKey?10:1;if(e.key==='ArrowLeft')selected.roi.x-=d;if(e.key==='ArrowRight')selected.roi.x+=d;if(e.key==='ArrowUp')selected.roi.y-=d;if(e.key==='ArrowDown')selected.roi.y+=d;clampRoi();syncControls();positionRoi()});
  window.addEventListener('keyup',e=>{if(e.code==='Space'&&selected){e.preventDefault();drawPreview(false)}});
})();
</script>
</body>
